<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Settings — Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .logo-preview { width: 80px; height: 80px; border-radius: 8px; object-fit: contain; border: 1px solid #e5e5e5; background: #fafafa; }
    .status-msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; }
    .status-msg.show { display: block; }
    .status-msg.ok { background: #dcfce7; color: #166534; }
    .status-msg.err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Store Settings</h1>
      </div>

      <div class="status-msg" id="status-msg"></div>

      <form id="settings-form">
        <div class="card">
          <h2>Identity</h2>
          <div class="field">
            <label>Store name *</label>
            <input id="s-store-name" required />
          </div>
          <div class="field">
            <label>Store description</label>
            <textarea id="s-description" rows="2"></textarea>
          </div>
          <div class="field">
            <label>Store logo</label>
            <div class="row">
              <img id="logo-preview" class="logo-preview" alt="" />
              <label class="btn btn-light btn-sm" style="cursor:pointer;">
                Upload logo
                <input id="logo-file" type="file" accept="image/*" style="display:none;">
              </label>
              <button type="button" class="btn btn-red btn-sm" id="remove-logo-btn">Remove</button>
            </div>
          </div>
        </div>

        <div class="card mt-24">
          <h2>Contact</h2>
          <div class="grid-2">
            <div class="field">
              <label>WhatsApp number * <span class="muted" style="font-weight:400;">(digits only, e.g. 233XXXXXXXXX)</span></label>
              <input id="s-whatsapp" required placeholder="233XXXXXXXXX" />
            </div>
            <div class="field">
              <label>Contact phone</label>
              <input id="s-phone" placeholder="+233 ..." />
            </div>
          </div>
          <div class="field">
            <label>Contact email</label>
            <input id="s-email" type="email" />
          </div>
          <div class="field">
            <label>Delivery information</label>
            <textarea id="s-delivery" rows="2" placeholder="e.g. Delivery within Accra 1–2 business days. Free over ₵300."></textarea>
          </div>
        </div>

        <div class="card mt-24">
          <h2>Currency</h2>
          <div class="grid-2">
            <div class="field">
              <label>Currency code</label>
              <input id="s-currency" placeholder="GHS" />
            </div>
            <div class="field">
              <label>Currency symbol</label>
              <input id="s-currency-symbol" placeholder="₵" />
            </div>
          </div>
        </div>

        <div class="card mt-24">
          <h2>Social links</h2>
          <div class="field"><label>Instagram</label><input id="s-instagram" placeholder="https://instagram.com/..." /></div>
          <div class="field"><label>Facebook</label><input id="s-facebook" placeholder="https://facebook.com/..." /></div>
          <div class="field"><label>TikTok</label><input id="s-tiktok" placeholder="https://tiktok.com/@..." /></div>
          <div class="field"><label>X / Twitter</label><input id="s-twitter" placeholder="https://x.com/..." /></div>
        </div>

        <div class="mt-24 row" style="justify-content: flex-end;">
          <button type="submit" class="btn btn-dark" id="save-btn">Save Settings</button>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let currentLogoUrl = '';
    let newLogoFile = null;

    function showStatus(msg, type='ok') {
      const el = $('status-msg');
      el.className = `status-msg show ${type}`;
      el.textContent = msg;
      if (type === 'ok') setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function loadSettings() {
      const { data, error } = await supabaseClient.from('store_settings').select('*').eq('id', 1).single();
      if (error && error.code !== 'PGRST116') {
        showStatus('Load error: ' + error.message, 'err');
        return;
      }
      const s = data || {};
      $('s-store-name').value = s.store_name || '';
      $('s-description').value = s.store_description || '';
      $('s-whatsapp').value = s.whatsapp_number || '';
      $('s-phone').value = s.contact_phone || '';
      $('s-email').value = s.contact_email || '';
      $('s-delivery').value = s.delivery_info || '';
      $('s-currency').value = s.currency || 'GHS';
      $('s-currency-symbol').value = s.currency_symbol || '₵';
      currentLogoUrl = s.store_logo || '';
      updateLogoPreview();
      const socials = s.social_links || {};
      $('s-instagram').value = socials.instagram || '';
      $('s-facebook').value = socials.facebook || '';
      $('s-tiktok').value = socials.tiktok || '';
      $('s-twitter').value = socials.twitter || '';
    }

    function updateLogoPreview() {
      const preview = $('logo-preview');
      if (newLogoFile) {
        preview.src = URL.createObjectURL(newLogoFile);
        preview.style.display = 'block';
      } else if (currentLogoUrl) {
        preview.src = currentLogoUrl;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    $('logo-file').addEventListener('change', e => {
      const f = e.target.files?.[0];
      if (!f) return;
      newLogoFile = f;
      updateLogoPreview();
    });

    $('remove-logo-btn').addEventListener('click', () => {
      newLogoFile = null;
      currentLogoUrl = '';
      updateLogoPreview();
    });

    async function uploadLogo(file) {
      const ext = file.name.split('.').pop();
      const path = `store/logo-${Date.now()}.${ext}`;
      const { error } = await supabaseClient.storage
        .from('product-images').upload(path, file, { cacheControl: '3600', upsert: true });
      if (error) throw error;
      const { data } = supabaseClient.storage.from('product-images').getPublicUrl(path);
      return data.publicUrl;
    }

    $('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        let logoUrl = currentLogoUrl;
        if (newLogoFile) logoUrl = await uploadLogo(newLogoFile);

        const payload = {
          store_name: $('s-store-name').value.trim(),
          store_description: $('s-description').value.trim() || null,
          store_logo: logoUrl || null,
          whatsapp_number: $('s-whatsapp').value.trim().replace(/\s/g, ''),
          contact_phone: $('s-phone').value.trim() || null,
          contact_email: $('s-email').value.trim() || null,
          delivery_info: $('s-delivery').value.trim() || null,
          currency: $('s-currency').value.trim() || 'GHS',
          currency_symbol: $('s-currency-symbol').value.trim() || '₵',
          social_links: {
            instagram: $('s-instagram').value.trim() || undefined,
            facebook: $('s-facebook').value.trim() || undefined,
            tiktok: $('s-tiktok').value.trim() || undefined,
            twitter: $('s-twitter').value.trim() || undefined,
          },
        };

        Object.keys(payload.social_links).forEach(k => {
          if (payload.social_links[k] === undefined) delete payload.social_links[k];
        });

        if (!payload.store_name) throw new Error('Store name is required.');
        if (!payload.whatsapp_number) throw new Error('WhatsApp number is required.');

        const { error } = await supabaseClient.from('store_settings').upsert({ id: 1, ...payload });
        if (error) throw error;

        currentLogoUrl = logoUrl;
        newLogoFile = null;
        showStatus('Settings saved ✓');
      } catch (err) {
        console.error(err);
        showStatus(err.message || 'Save failed', 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Settings';
      }
    });

    (async () => {
      await requireAdmin();
      await mountAdminShell('settings');
      await loadSettings();
    })();
  </script>
</body>
</html>
