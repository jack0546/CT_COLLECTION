<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Chat — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .wa-container { display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 120px); background: #f0f2f5; border: 1px solid #d1d7db; border-radius: 8px; overflow: hidden; margin: 20px auto; max-width: 1400px; }
    @media (max-width: 768px) { .wa-container { grid-template-columns: 1fr; margin: 0; height: calc(100vh - 64px); border-radius: 0; border: none; } .wa-sidebar { display: none; } .wa-mobile-header { display: flex !important; } }
    
    .wa-sidebar { background: #fff; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; height: 100%; }
    .wa-sidebar-header { padding: 15px; background: #f0f2f5; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d7db; flex-shrink: 0; }
    .wa-search { margin: 10px 15px; padding: 8px 12px; background: #f0f2f5; border-radius: 8px; font-size: 14px; border: none; outline: none; flex-shrink: 0; }
    .wa-chat-list { flex: 1; overflow-y: auto; }
    .wa-chat-item { display: flex; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; background: #f0f2f5; }
    .wa-avatar { width: 49px; height: 49px; border-radius: 50%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; margin-right: 15px; flex-shrink: 0; }
    .wa-chat-info { flex: 1; min-width: 0; }
    .wa-chat-name { font-size: 16px; color: #111b21; margin-bottom: 3px; font-weight: 500; }
    .wa-chat-msg { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .wa-main { display: flex; flex-direction: column; background: #efeae2; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; height: 100%; }
    .wa-main-header { padding: 10px 20px; background: #f0f2f5; border-bottom: 1px solid #d1d7db; display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
    .wa-mobile-header { display: none; padding: 10px 15px; background: #f0f2f5; border-bottom: 1px solid #d1d7db; align-items: center; gap: 10px; }
    .wa-mobile-header a { font-size: 20px; text-decoration: none; color: #0a0a0a; font-weight: bold; }

    .wa-messages { flex: 1; overflow-y: auto; padding: 20px 50px; display: flex; flex-direction: column; gap: 10px; }
    
    .wa-msg { max-width: 65%; padding: 4px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
    .wa-msg.customer { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; color: #111b21; }
    .wa-msg.admin { background: #fff; align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
    
    .wa-img { width: 100%; max-width: 300px; max-height: 300px; object-fit: cover; border-radius: 6px; cursor: pointer; display: block; }
    
    .msg-content { padding: 4px 8px; }
    .wa-time { font-size: 11px; color: #667781; float: right; margin-left: 10px; margin-top: 5px; }
    .wa-tick { font-size: 11px; color: #53bdeb; margin-left: 4px; }

    .wa-input-area { padding: 10px 20px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .wa-icon-btn { background: none; border: none; cursor: pointer; color: #54656f; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .wa-icon-btn:hover { color: #00a884; }
    .wa-input-area input { flex: 1; padding: 12px 15px; border-radius: 8px; border: none; outline: none; font-size: 15px; }
    .wa-send-btn { background: #00a884; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .wa-send-btn:hover { background: #008f72; }

    /* Image Preview Modal */
    .preview-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .preview-content { background: #fff; border-radius: 12px; overflow: hidden; width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .preview-img { width: 100%; max-height: 50vh; object-fit: contain; background: #000; }
    .preview-footer { padding: 15px; background: #f0f2f5; }
    .preview-footer input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .preview-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-cancel { background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .btn-send { background: #00a884; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding: 0 16px;">
    <div class="wa-container">
      <div class="wa-sidebar">
        <div class="wa-sidebar-header"><strong>Chats</strong><span>👤</span></div>
        <input type="text" class="wa-search" placeholder="Search" disabled>
        <div class="wa-chat-list">
          <div class="wa-chat-item active">
            <div class="wa-avatar">A</div>
            <div class="wa-chat-info">
              <div class="wa-chat-name">Great Addesam Support</div>
              <div class="wa-chat-msg">We usually reply within minutes.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="wa-main">
        <div class="wa-mobile-header">
          <a href="index.html">←</a>
          <div class="wa-avatar" style="width:36px; height:36px; font-size:14px; margin-right:5px;">A</div>
          <strong style="font-size:15px;">Great Addesam Support</strong>
        </div>

        <div class="wa-main-header">
          <div class="wa-avatar" style="width:40px; height:40px; font-size:16px;">A</div>
          <strong>Great Addesam Support</strong>
        </div>
        
        <div class="wa-messages" id="chat-messages">
          <div style="text-align:center; margin-top:20px;">
            <p style="background:#fff9c4; padding:5px 10px; border-radius:8px; font-size:12px; color:#666; display:inline-block;">
              🔒 Messages are end-to-end encrypted.
            </p>
          </div>
        </div>

        <div class="wa-input-area">
          <input type="file" id="image-upload" accept="image/*" style="display:none;">
          <button class="wa-icon-btn" onclick="document.getElementById('image-upload').click()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
          </button>
          <input id="chat-input" type="text" placeholder="Type a message">
          <button class="wa-send-btn" id="chat-send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="preview-modal" id="preview-modal">
    <div class="preview-content">
      <img id="preview-image" class="preview-img" src="" alt="Preview">
      <div class="preview-footer">
        <input type="text" id="preview-caption" placeholder="Add a caption...">
        <div class="preview-actions">
          <button class="btn-cancel" onclick="closePreview()">Cancel</button>
          <button class="btn-send" id="preview-send-btn" onclick="sendPreviewedImage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    let chatChannel = null;
    let updateChannel = null;
    let chatUser = null;
    let pendingFile = null;

    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const imageUpload = document.getElementById('image-upload');
    
    const previewModal = document.getElementById('preview-modal');
    const previewImage = document.getElementById('preview-image');
    const previewCaption = document.getElementById('preview-caption');
    const previewSendBtn = document.getElementById('preview-send-btn');

    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, ctx.currentTime); 
        gain1.gain.setValueAtTime(0.3, ctx.currentTime); gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.connect(gain1); gain1.connect(ctx.destination); osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.3);
        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.type = 'sine'; osc2.frequency.setValueAtTime(660, ctx.currentTime + 0.1); 
        gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.1); gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination); osc2.start(ctx.currentTime + 0.1); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    async function initChat() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        chatMessages.innerHTML = '<p style="text-align:center; padding:20px; background:#fff; border-radius:8px;">Please <a href="login.html" style="text-decoration:underline;">log in</a> to chat with support.</p>';
        chatInput.disabled = true; chatSend.disabled = true;
        return;
      }
      
      chatUser = user;

      const { data: msgs } = await supabaseClient
        .from('chat_messages')
        .select('*')
        .eq('user_id', chatUser.id)
        .order('created_at', { ascending: true });

      if (msgs && msgs.length > 0) {
        msgs.forEach(appendMessage);
      }
      
      chatMessages.scrollTop = chatMessages.scrollHeight;

      chatChannel = supabaseClient
        .channel('customer-chat-page')
        .on('postgres_changes', { 
          event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `user_id=eq.${chatUser.id}`
        }, payload => {
          if (payload.new.sender === 'admin') {
            appendMessage(payload.new);
            playNotificationSound();
          }
        })
        .subscribe();

      updateChannel = supabaseClient
        .channel('customer-chat-updates')
        .on('postgres_changes', {
          event: 'UPDATE', schema: 'public', table: 'chat_messages', filter: `user_id=eq.${chatUser.id}`
        }, payload => {
          const msgId = payload.new.id;
          const wrapper = document.querySelector(`[data-msg-id="${msgId}"]`);
          if (wrapper) {
            const tick = wrapper.querySelector('.wa-tick');
            if (tick && payload.new.sender === 'customer') {
              tick.innerHTML = '✓✓';
            }
          }
        })
        .subscribe();
    }

    function appendMessage(msg) {
      const time = new Date(msg.created_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      
      const div = document.createElement('div');
      div.className = `wa-msg ${msg.sender}`;
      div.dataset.msgId = msg.id;
      
      let tickHtml = '';
      if (msg.sender === 'customer') {
        tickHtml = `<span class="wa-tick">${msg.is_read ? '✓✓' : '✓'}</span>`;
      }
      
      let imageHtml = '';
      if (msg.image_url) {
        imageHtml = `<img src="${msg.image_url}" class="wa-img" onclick="window.open('${msg.image_url}', '_blank')">`;
      }
      
      div.innerHTML = `
        ${imageHtml}
        <div class="msg-content">
          ${msg.message ? `<div>${msg.message}</div>` : ''}
          <span class="wa-time">${time}${tickHtml}</span>
        </div>
      `;
      
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend.addEventListener('click', async () => {
      const text = chatInput.value.trim();
      if (!text || !chatUser) return;
      chatInput.value = '';
      
      const { data: newMsg } = await supabaseClient.from('chat_messages').insert({
        user_id: chatUser.id, sender: 'customer', message: text, is_read: false
      }).select().single();
      
      if (newMsg) appendMessage(newMsg);
    });

    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') chatSend.click(); });

    // --- IMAGE PREVIEW LOGIC ---
    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !chatUser) return;

      pendingFile = file;
      const reader = new FileReader();
      reader.onload = (event) => {
        previewImage.src = event.target.result;
        previewCaption.value = '';
        previewModal.style.display = 'flex';
        previewCaption.focus();
      };
      reader.readAsDataURL(file);
      imageUpload.value = ''; 
    });

    function closePreview() {
      previewModal.style.display = 'none';
      pendingFile = null;
    }

    // THE OPTIMISTIC UI FIX
    async function sendPreviewedImage() {
      if (!pendingFile || !chatUser) return;

      const localUrl = URL.createObjectURL(pendingFile);
      const tempId = 'temp-' + Date.now();
      const caption = previewCaption.value.trim();
      
      // 1. Instantly show the image
      appendMessage({
        id: tempId,
        sender: 'customer',
        message: caption,
        image_url: localUrl,
        created_at: new Date().toISOString(),
        is_read: false
      });

      closePreview();

      // 2. Upload in background
      const fileExt = pendingFile.name.split('.').pop();
      const fileName = `${chatUser.id}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('chat-images')
        .upload(fileName, pendingFile);

      if (!uploadError) {
        const { data: urlData } = supabaseClient.storage.from('chat-images').getPublicUrl(fileName);
        
        await supabaseClient.from('chat_messages').insert({
          user_id: chatUser.id, 
          sender: 'customer', 
          message: caption, 
          image_url: urlData.publicUrl, 
          is_read: false
        });
      } else {
        alert('Failed to upload image.');
      }
    }

    initChat();
  </script>
</body>
</html>
