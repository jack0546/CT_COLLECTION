<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding:32px 16px 80px;">
    <h1 style="margin:0 0 20px;">Checkout</h1>

    <!-- Shown if the user is LOGGED IN -->
    <div id="logged-in-info" class="form-card" style="display:none; background:#f0fdf4; border-color:#bbf7d0; margin-bottom:20px;">
      <h3 style="margin-top:0; color:#166534;">Delivery Details Saved</h3>
      <p style="margin:5px 0;"><strong>Name:</strong> <span id="display-name"></span></p>
      <p style="margin:5px 0;"><strong>Phone:</strong> <span id="display-phone"></span></p>
      <p style="margin:5px 0;"><strong>Address:</strong> <span id="display-address" style="line-height: 1.5;"></span></p>
      <p class="muted" style="font-size:12px; margin-top:10px;">If you need to change these details, please update them in your <a href="account.html" style="text-decoration:underline;">Account Profile</a>.</p>
    </div>

    <form class="form-card" id="checkout-form" novalidate>
      
      <!-- Hidden if the user is LOGGED IN -->
      <div id="guest-form-fields">
        <div class="form-field">
          <label>Full name <span class="req">*</span></label>
          <input id="c-name" required />
        </div>
        <div class="form-field">
          <label>Email address <span class="req">*</span></label>
          <input id="c-email" type="email" required placeholder="e.g. you@example.com" />
        </div>
        <div class="form-field">
          <label>Phone number <span class="req">*</span></label>
          <input id="c-phone" type="tel" required placeholder="e.g. 0240000000" />
        </div>
        <div class="form-field">
          <label>Delivery location / city <span class="req">*</span></label>
          <input id="c-location" required />
        </div>
        <div class="form-field">
          <label>Delivery address / landmark <span class="req">*</span></label>
          <input id="c-address" required />
        </div>
      </div>

      <div class="form-field">
        <label>Additional instructions (Optional)</label>
        <textarea id="c-notes" rows="3"></textarea>
      </div>

      <div class="form-field" style="display: flex; gap: 8px; align-items: flex-start; margin-top: 20px;">
        <input type="checkbox" id="c-terms" required style="margin-top: 4px; width: auto;" />
        <label for="c-terms" style="font-weight: normal; font-size: 13px; color: #555; line-height: 1.4;">
          I agree to the <a href="terms.html" target="_blank" style="text-decoration: underline;">Terms & Conditions</a> and 
          <a href="privacy.html" target="_blank" style="text-decoration: underline;">Privacy Policy</a>.
        </label>
      </div>

      <div id="checkout-summary" class="muted" style="margin:16px 0;"></div>

      <div class="form-actions" style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-green" type="button" id="paystack-btn">
          💳 Pay Now (Secure)
        </button>
      </div>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/checkout.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
