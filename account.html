<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <style>
    .account-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e5e5e5; }
    .account-tabs button { background: none; border: none; padding: 10px 15px; font-size: 14px; font-weight: 500; cursor: pointer; color: #737373; }
    .account-tabs button.active { color: #0a0a0a; border-bottom: 2px solid #0a0a0a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .order-card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #e5e5e5; padding-bottom: 10px; margin-bottom: 10px; }
    
    .badge { font-weight: bold; font-size: 11px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-unpaid { background: #fee2e2; color: #991b1b; }
    
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-confirmed { background: #e0f2fe; color: #075985; }
    .badge-processing { background: #f3e8ff; color: #6b21a8; }
    .badge-shipped { background: #e0e7ff; color: #3730a3; }
    .badge-delivered { background: #dcfce7; color: #166534; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }

    .order-items { font-size: 13px; color: #555; margin-bottom: 10px; }

    select { width: 100%; padding: 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; background-color: #fff; }
    .profile-data-row { margin-bottom: 15px; }
    .profile-data-label { font-size: 12px; color: #737373; margin-bottom: 4px; display: block; }
    .profile-data-value { font-size: 15px; font-weight: 500; color: #0a0a0a; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding: 40px 16px 80px; max-width: 700px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1 style="margin: 0;">My Account</h1>
      <button onclick="logout()" class="btn btn-light" style="border: 1px solid #ccc; padding: 8px 15px;">Sign Out</button>
    </div>

    <div class="account-tabs">
      <button id="tab-orders" class="active" onclick="switchTab('orders')">Order History</button>
      <button id="tab-profile" onclick="switchTab('profile')">My Profile & Address</button>
    </div>

    <div id="content-orders" class="tab-content active">
      <div id="orders-list">Loading your orders...</div>
    </div>

    <div id="content-profile" class="tab-content">
      
      <div id="profile-view" class="form-card">
        <div id="profile-loading" style="color:#737373;">Loading your details from database...</div>
        
        <div id="profile-data" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
            <h3 style="margin: 0;">Delivery Details</h3>
            <button onclick="toggleEditMode(true)" class="btn btn-light" style="border: 1px solid #0a0a0a; padding: 6px 12px; font-size: 13px;">Edit Profile</button>
          </div>

          <div class="profile-data-row"><span class="profile-data-label">Full Name</span><span class="profile-data-value" id="view-name"></span></div>
          <div class="profile-data-row"><span class="profile-data-label">Email Address (Cannot be changed)</span><span class="profile-data-value" id="view-email" style="color: #666;"></span></div>
          <div class="profile-data-row"><span class="profile-data-label">Phone Number</span><span class="profile-data-value" id="view-phone"></span></div>
          
          <h4 style="margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;">Address</h4>
          
          <div class="profile-data-row">
            <span class="profile-data-label">Delivery Address</span>
            <span class="profile-data-value" id="view-full-address" style="line-height: 1.5;"></span>
          </div>
        </div>
      </div>

      <form id="profile-form" class="form-card" style="display: none;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-field"><label>First Name</label><input id="p-fname" required /></div>
          <div class="form-field"><label>Last Name</label><input id="p-lname" required /></div>
        </div>
        
        <div class="form-field"><label>Phone Number</label><input id="p-phone" type="tel" required /></div>
        
        <h4 style="margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;">Delivery Address</h4>
        
        <div class="form-field">
          <label>Region</label>
          <select id="p-region" required>
            <option value="Ahafo">Ahafo</option>
            <option value="Ashanti">Ashanti</option>
            <option value="Bono">Bono</option>
            <option value="Bono East">Bono East</option>
            <option value="Central">Central</option>
            <option value="Eastern">Eastern</option>
            <option value="Greater Accra">Greater Accra</option>
            <option value="North East">North East</option>
            <option value="Northern">Northern</option>
            <option value="Oti">Oti</option>
            <option value="Savannah">Savannah</option>
            <option value="Upper East">Upper East</option>
            <option value="Upper West">Upper West</option>
            <option value="Volta">Volta</option>
            <option value="Western">Western</option>
            <option value="Western North">Western North</option>
          </select>
        </div>

        <div class="form-field"><label>City / Town</label><input id="p-city" required /></div>
        <div class="form-field"><label>Suburb / Area</label><input id="p-suburb" required /></div>
        <div class="form-field"><label>House Number / Street Name</label><input id="p-street" required /></div>
        <div class="form-field"><label>Nearest Landmark (Optional)</label><input id="p-landmark" /></div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="toggleEditMode(false)" class="btn btn-light" style="flex: 1; border: 1px solid #ccc;">Cancel</button>
          <button type="submit" class="btn btn-dark" style="flex: 2;" id="update-btn">Save Changes</button>
        </div>
        <p id="profile-msg" style="text-align:center; margin-top:10px; font-size:13px;"></p>
      </form>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script> 
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    let currentUser = null;
    let userProfile = null;

    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
      userProfile = data;

      await Promise.all([loadOrders(), loadProfile()]);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.account-tabs button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`content-${tab}`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      
      if (tab === 'orders') toggleEditMode(false);
    }

    async function loadOrders() {
      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('orders-list');
      if (error || !orders || orders.length === 0) {
        list.innerHTML = '<p class="muted">You have no orders yet. <a href="shop.html" style="text-decoration:underline;">Start shopping</a>.</p>';
        return;
      }

      list.innerHTML = orders.map(o => {
        const payClass = o.payment_status === 'paid' ? 'status-paid' : 'status-unpaid';
        const currentStatus = (o.status || 'pending').toLowerCase();
        const statusClass = `badge-${currentStatus}`;
        const statusText = currentStatus.charAt(0).toUpperCase() + currentStatus.slice(1);

        let itemsHTML = '';
        if (o.order_items && o.order_items.length > 0) {
            itemsHTML = o.order_items.map(i => `${i.quantity}x ${i.productName}`).join(', ');
        }

        let actionButtons = `<a href="track-order.html" class="btn btn-light" style="font-size:12px; padding:5px 10px; border:1px solid #ccc;">Track Order</a>`;
        
        if (o.payment_status !== 'paid') {
            actionButtons = `
              <button onclick="retryPayment('${o.order_reference}', ${o.total_amount})" class="btn btn-green" style="font-size:12px; padding:5px 10px; margin-right:5px;">💳 Pay Now</button>
              ${actionButtons}
            `;
        }
        
        return `
          <div class="order-card">
            <div class="order-header">
              <strong>${o.order_reference}</strong>
              <div style="display:flex; gap:8px;">
                <span class="badge ${payClass}">${o.payment_status.toUpperCase()}</span>
                <span class="badge ${statusClass}">${statusText}</span>
              </div>
            </div>
            <div class="order-items">${itemsHTML}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:12px; color:#737373;">${new Date(o.created_at).toLocaleDateString('en-GB')}</span>
              <strong>₵ ${Number(o.total_amount).toFixed(2)}</strong>
            </div>
            <div style="margin-top:10px; text-align:right;">
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    function retryPayment(reference, amount) {
      if (!userProfile || !userProfile.email) {
        alert("Could not find your email. Please update your profile first.");
        return;
      }

      const newRef = `${reference}-RETRY-${Date.now()}`;

      const paystack = new PaystackPop();
      paystack.newTransaction({
        key: 'pk_live_4f5e7d35d201c81efd615f2f98ba08c7b049f4ae',
        email: userProfile.email,
        amount: Math.round(amount * 100),
        reference: newRef,
        onSuccess: async (transaction) => {
          try {
            await supabaseClient.from('orders').update({ 
              payment_status: 'paid',
              paystack_reference: newRef 
            }).eq('order_reference', reference);

            alert('Payment successful! Your order is now paid.');
            setTimeout(() => window.location.reload(), 1500);
          } catch (err) {
            alert('Payment went through, but we could not update your order. Contact support with ref: ' + newRef);
          }
        },
        onCancel: () => {
          alert('Payment cancelled.');
        },
      });
    }

    async function loadProfile() {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle();
      
      const loadingText = document.getElementById('profile-loading');
      
      if (error) {
        loadingText.textContent = "Error loading profile.";
        return;
      }
      
      if (!profile) {
        loadingText.textContent = "No profile found. Please contact support.";
        return;
      }

      userProfile = profile;
      loadingText.style.display = 'none';
      document.getElementById('profile-data').style.display = 'block';

      const fullAddress = [
        profile.region,
        profile.city,
        profile.suburb,
        profile.street_name,
        profile.landmark
      ].filter(Boolean).join(' - ');

      document.getElementById('view-name').textContent = `${profile.first_name || ''} ${profile.last_name || ''}`.trim() || 'Not set';
      document.getElementById('view-email').textContent = profile.email || 'Not set';
      document.getElementById('view-phone').textContent = profile.phone || 'Not set';
      document.getElementById('view-full-address').textContent = fullAddress || 'Not set';

      document.getElementById('p-fname').value = profile.first_name || '';
      document.getElementById('p-lname').value = profile.last_name || '';
      document.getElementById('p-phone').value = profile.phone || '';
      document.getElementById('p-region').value = profile.region || 'Greater Accra';
      document.getElementById('p-city').value = profile.city || '';
      document.getElementById('p-suburb').value = profile.suburb || '';
      document.getElementById('p-street').value = profile.street_name || '';
      document.getElementById('p-landmark').value = profile.landmark || '';
    }

    function toggleEditMode(showEdit) {
      if (showEdit) {
        document.getElementById('profile-view').style.display = 'none';
        document.getElementById('profile-form').style.display = 'block';
      } else {
        document.getElementById('profile-form').style.display = 'none';
        document.getElementById('profile-view').style.display = 'block';
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('update-btn');
      const msg = document.getElementById('profile-msg');
      
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const updates = {
        first_name: document.getElementById('p-fname').value,
        last_name: document.getElementById('p-lname').value,
        phone: document.getElementById('p-phone').value,
        region: document.getElementById('p-region').value,
        city: document.getElementById('p-city').value,
        suburb: document.getElementById('p-suburb').value,
        street_name: document.getElementById('p-street').value,
        landmark: document.getElementById('p-landmark').value,
      };

      const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);

      if (error) {
        msg.textContent = 'Error updating profile. Please try again.';
        msg.style.color = '#dc2626';
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      } else {
        await loadProfile(); 
        msg.textContent = '✓ Address updated successfully!';
        msg.style.color = '#16a34a';
        btn.disabled = false;
        btn.textContent = 'Save Changes';
        setTimeout(() => { toggleEditMode(false); msg.textContent = ''; }, 1000);
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    checkAuth();
  </script>
</body>
</html>
