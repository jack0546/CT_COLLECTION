<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
    
    .auth-container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* Left Side: Image */
    .auth-image {
      flex: 1;
      background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      display: none; /* Hidden on mobile */
    }

    /* Right Side: Form */
    .auth-form-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      padding: 20px;
    }

    .auth-card {
      background: #0e5a4a; /* Deep Green from your image */
      color: #fff;
      padding: 50px 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .auth-icon {
      margin: 0 auto 30px;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card h2 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }

    .auth-input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .auth-input-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 12px 0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .auth-input-group input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .auth-input-group input:focus {
      border-bottom-color: #fff;
    }

    .auth-btn {
      background: #fff;
      color: #0e5a4a;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 20px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      background: #f0fdf4;
    }

    .auth-footer {
      margin-top: 30px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
    }

    .auth-footer a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }

    .auth-bottom-link {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 14px;
    }

    @media (min-width: 768px) {
      .auth-image { display: block; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Left Image Side -->
    <div class="auth-image"></div>

    <!-- Right Form Side -->
    <div class="auth-form-wrapper">
      <div class="auth-card">
        
        <div class="auth-icon">
          <!-- Fingerprint SVG Icon -->
          <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z" opacity="0.3"/>
            <path d="M12 7c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5z" opacity="0.5"/>
            <path d="M12 10c-1.105 0-2 .895-2 2s.895 2 2 2 2-.895 2-2-.895-2-2-2z"/>
          </svg>
        </div>

        <h2>Welcome Back</h2>

        <form id="login-form">
          <div class="auth-input-group">
            <input id="l-email" type="email" placeholder="E-mail address" required />
          </div>
          <div class="auth-input-group">
            <input id="l-pass" type="password" placeholder="Password" required />
          </div>
          
          <button type="submit" class="auth-btn" id="login-btn">Log in</button>
          <p id="login-msg" style="text-align:center; margin-top:15px; font-size:13px; color:#fca5a5;"></p>
        </form>

        <div class="auth-footer">
          By logging in, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.
        </div>

        <div class="auth-bottom-link">
          Don't have an account? <a href="register.html">Sign up.</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const msg = document.getElementById('login-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('l-email').value,
        password: document.getElementById('l-pass').value,
      });

      if (error) {
        msg.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Log in';
      } else {
        window.location.href = 'account.html'; 
      }
    });
  </script>
</body>
</html>
