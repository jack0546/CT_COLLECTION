<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Chat — Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />    <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
    }
    
    .admin-shell { display: flex; height: 100%; overflow: hidden; }
    .admin-main { flex: 1; display: flex; flex-direction: column; padding: 0 !important; height: 100%; }
    
    .wa-container { display: grid; grid-template-columns: 350px 1fr; flex: 1; background: #f0f2f5; overflow: hidden; min-height: 0; }

    /* Sidebar */
    .wa-sidebar { background: #fff; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .wa-sidebar-header { padding: 15px; background: #f0f2f5; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d7db; flex-shrink: 0; }
    .wa-search { margin: 10px 15px; padding: 8px 12px; background: #f0f2f5; border-radius: 8px; font-size: 14px; border: none; outline: none; flex-shrink: 0; }
    .wa-chat-list { flex: 1; overflow-y: auto; }
    
    .wa-chat-item { display: flex; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; }
    .wa-chat-item:hover, .wa-chat-item.active { background: #f0f2f5; }
    .wa-avatar { width: 49px; height: 49px; border-radius: 50%; background: #dfe5e7; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #555; margin-right: 15px; flex-shrink: 0; }
    .wa-chat-info { flex: 1; min-width: 0; }
    .wa-chat-name { font-size: 16px; color: #111b21; margin-bottom: 3px; font-weight: 500; }
    .wa-chat-msg { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-chat-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .wa-chat-time { font-size: 12px; color: #667781; margin-bottom: 5px; }
    .wa-badge { background: #25d366; color: #fff; border-radius: 50%; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }

    /* Main Chat Area */
    .wa-main { 
      display: flex; 
      flex-direction: column; 
      background: #efeae2; 
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
      background-size: cover; 
      height: 100%; 
      overflow: hidden; 
      position: relative; /* CRITICAL FOR ABSOLUTE INPUT */
    }
    
    .wa-main-header { 
      padding: 10px 20px; 
      background: #f0f2f5; 
      border-bottom: 1px solid #d1d7db; 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      flex-shrink: 0; 
    }
    
    /* THE FIX: Message area scrolls internally */
    .wa-messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px 50px 80px 50px; /* 80px padding at bottom so last message isn't hidden behind input */
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      min-height: 0; 
    }
    
    .wa-msg { max-width: 65%; padding: 4px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
    .wa-msg.customer { background: #fff; align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
    .wa-msg.admin { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; color: #111b21; }
    
    .wa-img { width: 100%; max-width: 300px; max-height: 300px; object-fit: cover; border-radius: 6px; cursor: pointer; display: block; }
    
    .wa-doc { display: flex; align-items: center; gap: 10px; background: #f0f2f5; padding: 10px; border-radius: 6px; margin-bottom: 5px; text-decoration: none; color: #111b21; cursor: pointer; }
    .wa-doc:hover { background: #e5e7eb; }
    .wa-doc-icon { background: #dc2626; color: #fff; width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; }
    .wa-doc-info { flex: 1; min-width: 0; }
    .wa-doc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-doc-size { font-size: 11px; color: #667781; }
    
    .msg-content { padding: 4px 8px; }
    .wa-time { font-size: 11px; color: #667781; float: right; margin-left: 10px; margin-top: 5px; }

    /* THE FIX: INPUT AREA PINNED TO BOTTOM */
    .wa-input-area { 
      position: absolute; /* Absolute positioning inside .wa-main */
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 20px; 
      background: #f0f2f5; 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      border-top: 1px solid #d1d7db; 
      z-index: 10;
    }
    
    .wa-icon-btn { background: none; border: none; cursor: pointer; color: #54656f; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .wa-icon-btn:hover { color: #00a884; }
    .wa-input-area input { flex: 1; padding: 12px 15px; border-radius: 8px; border: none; outline: none; font-size: 15px; min-width: 0; }
    .wa-send-btn { background: #00a884; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .wa-send-btn:hover { background: #008f72; }

    .preview-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .preview-content { background: #fff; border-radius: 12px; overflow: hidden; width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .preview-img { width: 100%; max-height: 50vh; object-fit: contain; background: #000; }
    .preview-footer { padding: 15px; background: #f0f2f5; }
    .preview-footer input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .preview-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-cancel { background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .btn-send { background: #00a884; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #667781; text-align: center; width: 100%;}
    
    .mobile-back-btn { display: none; }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) { 
      .wa-container { 
        grid-template-columns: 1fr; 
        display: flex; 
        flex-direction: column; 
        position: absolute; 
        top: 130px; /* Topbar height */
        bottom: 0; 
        left: 0; 
        right: 0; 
      } 
      
      .wa-sidebar { 
        display: flex; 
        width: 100%; 
        height: 100%; 
      } 
      
      .wa-main { 
        display: none; 
        width: 100%; 
        height: 100%; 
      }
      
      .wa-container.chat-active .wa-sidebar { display: none; }
      .wa-container.chat-active .wa-main { display: flex; }
      
      .wa-messages { padding: 15px 15px 80px 15px; } 
      
      .mobile-back-btn { display: block; background: none; border: none; font-size: 20px; margin-right: 10px; color: #54656f; cursor: pointer; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <div class="admin-topbar" style="padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0; font-size: 20px;">Live Chat</h1>
        <button onclick="logout()" class="btn btn-light" style="font-size: 12px; padding: 5px 10px;">Sign Out</button>
      </div>
      
      <div class="wa-container" id="wa-container">
        <!-- Sidebar -->
        <div class="wa-sidebar">
          <div class="wa-sidebar-header"><strong>Chats</strong><span>👤</span></div>
          <input type="text" class="wa-search" placeholder="Search or start a new chat" disabled>
          <div class="wa-chat-list" id="user-list">
            <p style="padding:20px; text-align:center; color:#666;">Loading chats...</p>
          </div>
        </div>

        <!-- Main Chat Area -->
        <div class="wa-main">
          <div class="wa-main-header" id="chat-header">
            <button class="mobile-back-btn" onclick="document.getElementById('wa-container').classList.remove('chat-active')">←</button>
            
            <div class="wa-avatar" id="header-avatar" style="width:40px; height:40px; font-size:16px;">C</div>
            <strong id="chat-header-name">Select a chat</strong>
          </div>
          
          <div class="wa-messages" id="chat-messages">
            <div class="empty-state" style="width:100%;">
              <h2>Great Addesam Admin</h2>
              <p>Select a chat to start messaging</p>
            </div>
          </div>

          <div class="wa-input-area" id="chat-input-area">
            <input type="file" id="admin-image-upload" accept="image/*" style="display:none;">
            <button class="wa-icon-btn" onclick="document.getElementById('admin-image-upload').click()" title="Send Image">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
            </button>
            
            <input type="file" id="admin-doc-upload" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none;">
            <button class="wa-icon-btn" onclick="document.getElementById('admin-doc-upload').click()" title="Send Document">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            </button>
            
            <input id="admin-chat-input" type="text" placeholder="Type a message">
            <button class="wa-send-btn" id="admin-chat-send">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="preview-modal" id="preview-modal">
    <div class="preview-content">
      <img id="preview-image" class="preview-img" src="" alt="Preview">
      <div class="preview-footer">
        <input type="text" id="preview-caption" placeholder="Add a caption...">
        <div class="preview-actions">
          <button class="btn-cancel" onclick="closePreview()">Cancel</button>
          <button class="btn-send" id="preview-send-btn" onclick="sendPreviewedImage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    let activeUserId = null;
    let adminChannel = null;
    let pendingFile = null;

    const adminImageUpload = document.getElementById('admin-image-upload');
    const adminDocUpload = document.getElementById('admin-doc-upload');
    const previewModal = document.getElementById('preview-modal');
    const previewImage = document.getElementById('preview-image');
    const previewCaption = document.getElementById('preview-caption');

    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, ctx.currentTime); 
        gain1.gain.setValueAtTime(0.3, ctx.currentTime); gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.connect(gain1); gain1.connect(ctx.destination); osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.3);
        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.type = 'sine'; osc2.frequency.setValueAtTime(660, ctx.currentTime + 0.1); 
        gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.1); gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination); osc2.start(ctx.currentTime + 0.1); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    async function loadUsers() {
      const { data, error } = await supabaseClient
        .from('chat_messages')
        .select('user_id, created_at, message, sender, is_read, image_url')
        .order('created_at', { ascending: false });

      if (error || !data) return;

      const latestMessages = new Map();
      data.forEach(msg => {
        if (!latestMessages.has(msg.user_id)) latestMessages.set(msg.user_id, msg);
      });

      const uniqueUsers = Array.from(latestMessages.values());
      const list = document.getElementById('user-list');
      
      if (uniqueUsers.length === 0) {
        list.innerHTML = '<p style="padding:20px; text-align:center; color:#666;">No active chats.</p>';
        return;
      }

      const userIds = uniqueUsers.map(u => u.user_id);
      const { data: profiles } = await supabaseClient.from('profiles').select('id, first_name, last_name, email').in('id', userIds);
      const profileMap = new Map(profiles?.map(p => [p.id, p]));

      list.innerHTML = uniqueUsers.map(u => {
        const p = profileMap.get(u.user_id) || {};
        const name = `${p.first_name || ''} ${p.last_name || ''}`.trim() || p.email || 'Customer';
        const initial = name.charAt(0).toUpperCase();
        
        const unread = data.filter(m => m.user_id === u.user_id && m.sender === 'customer' && !m.is_read).length;
        const time = new Date(u.created_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

        let previewText = u.message || '';
        if (u.image_url) {
           previewText = u.image_url.match(/\.(jpeg|jpg|gif|png|webp)$/i) ? (u.message ? '📷 ' + u.message : '📷 Photo') : '📄 Document';
        }

        const msgPrefix = u.sender === 'admin' ? '<span style="color:#00a884;">✓ </span>' : '';

        return `
          <div class="wa-chat-item ${activeUserId === u.user_id ? 'active' : ''}" onclick="openChat('${u.user_id}', '${name.replace(/'/g, "\\'")}', '${initial}')">
            <div class="wa-avatar">${initial}</div>
            <div class="wa-chat-info">
              <div class="wa-chat-name">${name}</div>
              <div class="wa-chat-msg">${msgPrefix}${previewText}</div>
            </div>
            <div class="wa-chat-meta">
              <div class="wa-chat-time">${time}</div>
              ${unread > 0 ? `<div class="wa-badge">${unread}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function openChat(userId, userName, initial) {
      activeUserId = userId;
      
      document.getElementById('wa-container').classList.add('chat-active');
      
      document.getElementById('chat-header-name').textContent = userName;
      document.getElementById('header-avatar').textContent = initial;
      
      document.querySelectorAll('.wa-chat-item').forEach(el => el.classList.remove('active'));

      const { data: msgs } = await supabaseClient
        .from('chat_messages')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: true });

      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      msgs?.forEach(m => appendAdminMsg(m));

      container.scrollTop = container.scrollHeight;

      await supabaseClient
        .from('chat_messages')
        .update({ is_read: true })
        .eq('user_id', userId)
        .eq('sender', 'customer')
        .eq('is_read', false);
        
      loadUsers(); 

      if (adminChannel) supabaseClient.removeChannel(adminChannel);
      adminChannel = supabaseClient
        .channel('admin-chat-' + userId)
        .on('postgres_changes', { 
          event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `user_id=eq.${userId}`
        }, payload => {
          if (payload.new.sender === 'customer') {
            appendAdminMsg(payload.new);
            playNotificationSound();
            loadUsers(); 
          }
        })
        .subscribe();
    }

    function appendAdminMsg(msg) {
      const container = document.getElementById('chat-messages');
      const emptyState = container.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      const time = new Date(msg.created_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      
      const div = document.createElement('div');
      div.className = `wa-msg ${msg.sender}`;
      
      let mediaHtml = '';
      if (msg.image_url) {
        if (msg.image_url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
            mediaHtml = `<img src="${msg.image_url}" class="wa-img" onclick="window.open('${msg.image_url}', '_blank')">`;
        } else {
            const fileName = msg.image_url.split('/').pop().split('?')[0];
            const fileExt = fileName.split('.').pop().toUpperCase();
            mediaHtml = `
              <div onclick="downloadFile('${msg.image_url}', '${fileName}')" class="wa-doc" style="cursor:pointer;">
                <div class="wa-doc-icon">${fileExt}</div>
                <div class="wa-doc-info">
                  <div class="wa-doc-name">${fileName}</div>
                  <div class="wa-doc-size" style="color: #00a884; font-weight: bold;">⬇ Click to download</div>
                </div>
              </div>
            `;
        }
      }
      
      div.innerHTML = `
        ${mediaHtml}
        <div class="msg-content">
          ${msg.message ? `<div>${msg.message}</div>` : ''}
          <span class="wa-time">${time}</span>
        </div>
      `;
      
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function downloadFile(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = filename; 
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (error) {
        alert("Failed to download file. Please try again.");
      }
    }

    document.getElementById('admin-chat-send').addEventListener('click', async () => {
      const input = document.getElementById('admin-chat-input');
      const text = input.value.trim();
      if (!text || !activeUserId) return;
      input.value = '';
      
      const { data: newMsg } = await supabaseClient.from('chat_messages').insert({
        user_id: activeUserId, sender: 'admin', message: text, is_read: false
      }).select().single();
      
      if (newMsg) {
        appendAdminMsg(newMsg);
        loadUsers();
      }
    });

    document.getElementById('admin-chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('admin-chat-send').click();
    });

    adminImageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !activeUserId) return;

      pendingFile = file;
      const reader = new FileReader();
      reader.onload = (event) => {
        previewImage.src = event.target.result;
        previewCaption.value = '';
        previewModal.style.display = 'flex';
        previewCaption.focus();
      };
      reader.readAsDataURL(file);
      adminImageUpload.value = ''; 
    });

    function closePreview() {
      previewModal.style.display = 'none';
      pendingFile = null;
    }

    async function sendPreviewedImage() {
      if (!pendingFile || !activeUserId) return;

      const localUrl = URL.createObjectURL(pendingFile);
      const caption = previewCaption.value.trim();
      
      appendAdminMsg({
        sender: 'admin',
        message: caption,
        image_url: localUrl,
        created_at: new Date().toISOString()
      });

      closePreview();

      const fileExt = pendingFile.name.split('.').pop();
      const fileName = `${activeUserId}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage.from('chat-images').upload(fileName, pendingFile);

      if (!uploadError) {
        const { data: urlData } = supabaseClient.storage.from('chat-images').getPublicUrl(fileName);
        await supabaseClient.from('chat_messages').insert({
          user_id: activeUserId, sender: 'admin', message: caption, image_url: urlData.publicUrl, is_read: false
        });
        loadUsers(); 
      }
    }

    adminDocUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeUserId) return;

      adminDocUpload.value = ''; 

      const fileExt = file.name.split('.').pop();
      const fileName = `${activeUserId}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage.from('chat-images').upload(fileName, file);

      if (!uploadError) {
        const { data: urlData } = supabaseClient.storage.from('chat-images').getPublicUrl(fileName);
        const { data: newMsg } = await supabaseClient.from('chat_messages').insert({
          user_id: activeUserId, sender: 'admin', message: '', image_url: urlData.publicUrl, is_read: false
        }).select().single();
        
        if (newMsg) {
          appendAdminMsg(newMsg);
          loadUsers();
        }
      } else {
        alert('Failed to upload document.');
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    (async () => {
      await requireAdmin();
      await mountAdminShell('chat');
      await loadUsers();
      
      supabaseClient
        .channel('admin-global-chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          if (!activeUserId || payload.new.user_id !== activeUserId) {
             loadUsers();
          }
        })
        .subscribe();
    })();
  </script>
</body>
</html>
