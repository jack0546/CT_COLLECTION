<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categories — Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .cat-form {
      display: grid;
      grid-template-columns: 1fr 1fr 100px 120px auto;
      gap: 8px; align-items: center; margin-bottom: 20px;
    }
    @media (max-width: 800px) { .cat-form { grid-template-columns: 1fr; } }
    .cat-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #f0f0f0; }
    .status-msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; }
    .status-msg.show { display: block; }
    .status-msg.ok { background: #dcfce7; color: #166534; }
    .status-msg.err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Categories</h1>
      </div>

      <div class="status-msg" id="status-msg"></div>

      <div class="card">
        <h2>Add New Category</h2>
        <form id="new-cat-form" class="cat-form">
          <input id="new-name" placeholder="Category name *" required />
          <input id="new-slug" placeholder="slug (auto)" />
          <input id="new-order" type="number" placeholder="Order" value="0" min="0" />
          <input id="new-image-url" placeholder="Image URL (optional)" />
          <button type="submit" class="btn btn-dark btn-sm">+ Add</button>
        </form>

        <div class="table-wrap">
          <table class="admin-table" id="categories-table">
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Slug</th>
                <th>Order</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="5" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const slugify = s => s.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/[\s_-]+/g,'-').replace(/^-+|-+$/g,'');

    function showStatus(msg, type='ok') {
      const el = $('status-msg');
      el.className = `status-msg show ${type}`;
      el.textContent = msg;
      if (type === 'ok') setTimeout(() => el.classList.remove('show'), 2500);
    }

    async function loadCategories() {
      const { data, error } = await supabaseClient.from('categories').select('*').order('sort_order');
      const tbody = document.querySelector('#categories-table tbody');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="muted">Error: ${error.message}</td></tr>`;
        return;
      }
      if (!data?.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted">No categories yet.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(c => `
        <tr>
          <td>${c.image_url ? `<img class="cat-thumb" src="${c.image_url}" alt="">` : ''}</td>
          <td><input value="${c.name}" data-edit="name" data-id="${c.id}" style="min-width:160px;"></td>
          <td><input value="${c.slug}" data-edit="slug" data-id="${c.id}" style="min-width:140px;"></td>
          <td><input type="number" value="${c.sort_order ?? 0}" data-edit="sort_order" data-id="${c.id}" style="width:80px;"></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-light btn-sm" data-save="${c.id}">Save</button>
            <button class="btn btn-red btn-sm" data-del="${c.id}">Delete</button>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-save]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.save;
          const inputs = tbody.querySelectorAll(`[data-id="${id}"]`);
          const update = {};
          inputs.forEach(inp => {
            const f = inp.dataset.edit;
            update[f] = f === 'sort_order' ? Number(inp.value) || 0 : inp.value.trim();
          });
          if (!update.name) return showStatus('Name is required', 'err');
          if (!update.slug) update.slug = slugify(update.name);
          const { error } = await supabaseClient.from('categories').update(update).eq('id', id);
          if (error) return showStatus(error.message, 'err');
          showStatus('Saved ✓');
          loadCategories();
        });
      });
      
      tbody.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this category? Products will be unassigned.')) return;
          const { error } = await supabaseClient.from('categories').delete().eq('id', btn.dataset.del);
          if (error) return showStatus(error.message, 'err');
          loadCategories();
        });
      });
    }

    $('new-cat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('new-name').value.trim();
      const slug = $('new-slug').value.trim() || slugify(name);
      const sort_order = Number($('new-order').value) || 0;
      const image_url = $('new-image-url').value.trim() || null;
      if (!name) return;
      
      // FIXED: changed supabase to supabaseClient here
      const { error } = await supabaseClient.from('categories').insert({ name, slug, sort_order, image_url });
      
      if (error) return showStatus(error.message, 'err');
      $('new-name').value = ''; $('new-slug').value = ''; $('new-order').value = '0'; $('new-image-url').value = '';
      showStatus('Category added ✓');
      loadCategories();
    });

    $('new-name').addEventListener('blur', () => {
      if (!$('new-slug').value.trim()) $('new-slug').value = slugify($('new-name').value);
    });

    (async () => {
      await requireAdmin();
      await mountAdminShell('categories');
      await loadCategories();
    })();
  </script>
</body>
</html>
