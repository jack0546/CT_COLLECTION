<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account — CT Collection</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
    
    .auth-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Side: Image */
    .auth-image {
      flex: 1;
      background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      display: none; 
    }

    /* Right Side: Form */
    .auth-form-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      padding: 40px 20px;
    }

    .auth-card {
      background: #0e5a4a; 
      color: #fff;
      padding: 50px 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .auth-icon {
      margin: 0 auto 20px;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card h2 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 25px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .auth-input-group {
      margin-bottom: 15px;
      position: relative;
    }

    .auth-input-group input, .auth-input-group select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 0;
      padding-right: 35px; /* Room for the eye icon */
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .auth-input-group select {
      appearance: none;
      cursor: pointer;
    }
    
    .auth-input-group select option {
      color: #0a0a0a;
    }

    .auth-input-group input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .auth-input-group input:focus, .auth-input-group select:focus {
      border-bottom-color: #fff;
    }

    /* Eye Icon Styling */
    .toggle-password {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 5px;
      font-size: 16px;
    }
    .toggle-password:hover {
      color: #fff;
    }

    .auth-btn {
      background: #fff;
      color: #0e5a4a;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      background: #f0fdf4;
    }

    .auth-footer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      line-height: 1.5;
    }

    .auth-footer a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }

    .checkbox-group {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 15px;
    }
    .checkbox-group input {
      width: auto;
      margin-top: 3px;
    }

    @media (min-width: 768px) {
      .auth-image { display: block; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Left Image Side -->
    <div class="auth-image"></div>

    <!-- Right Form Side -->
    <div class="auth-form-wrapper">
      <div class="auth-card">
        
        <div class="auth-icon">
          <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z" opacity="0.3"/>
            <path d="M12 7c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5z" opacity="0.5"/>
            <path d="M12 10c-1.105 0-2 .895-2 2s.895 2 2 2 2-.895 2-2-.895-2-2-2z"/>
          </svg>
        </div>

        <h2>Create Account</h2>

        <form id="register-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="auth-input-group">
              <input id="r-fname" type="text" placeholder="First Name" required />
            </div>
            <div class="auth-input-group">
              <input id="r-lname" type="text" placeholder="Last Name" required />
            </div>
          </div>

          <div class="auth-input-group">
            <input id="r-email" type="email" placeholder="E-mail address" required />
          </div>
          
          <!-- Password Field with Eye Icon -->
          <div class="auth-input-group">
            <input id="r-pass" type="password" placeholder="Password" required minlength="6" />
            <button type="button" class="toggle-password" onclick="togglePassword('r-pass', this)">👁️</button>
          </div>

          <!-- Confirm Password Field with Eye Icon -->
          <div class="auth-input-group">
            <input id="r-pass-confirm" type="password" placeholder="Confirm Password" required minlength="6" />
            <button type="button" class="toggle-password" onclick="togglePassword('r-pass-confirm', this)">👁️</button>
          </div>

          <div class="auth-input-group">
            <input id="r-phone" type="tel" placeholder="Phone Number" required />
          </div>

          <div class="auth-input-group">
            <select id="r-region" required style="color: rgba(255,255,255,0.7);">
              <option value="" disabled selected>Select Region</option>
              <option value="Ahafo">Ahafo</option>
              <option value="Ashanti">Ashanti</option>
              <option value="Bono">Bono</option>
              <option value="Bono East">Bono East</option>
              <option value="Central">Central</option>
              <option value="Eastern">Eastern</option>
              <option value="Greater Accra">Greater Accra</option>
              <option value="North East">North East</option>
              <option value="Northern">Northern</option>
              <option value="Oti">Oti</option>
              <option value="Savannah">Savannah</option>
              <option value="Upper East">Upper East</option>
              <option value="Upper West">Upper West</option>
              <option value="Volta">Volta</option>
              <option value="Western">Western</option>
              <option value="Western North">Western North</option>
            </select>
          </div>

          <div class="auth-input-group">
            <input id="r-city" type="text" placeholder="City / Town" required />
          </div>

          <div class="auth-input-group">
            <input id="r-address" type="text" placeholder="Address / Landmark" required />
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="r-terms" required />
            <label for="r-terms" style="font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.8);">
              I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.
            </label>
          </div>
          
          <button type="submit" class="auth-btn" id="reg-btn">Sign up</button>
          <p id="reg-msg" style="text-align:center; margin-top:15px; font-size:13px; color:#fca5a5;"></p>
        </form>

        <div class="auth-footer" style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; margin-top: 25px;">
          Already have an account? <a href="login.html">Log in.</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // Function to toggle password visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈'; // Hide icon
      } else {
        input.type = 'password';
        btn.textContent = '👁️'; // Show icon
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const msg = document.getElementById('reg-msg');
      
      const email = document.getElementById('r-email').value;
      const password = document.getElementById('r-pass').value;
      const confirmPassword = document.getElementById('r-pass-confirm').value;
      const region = document.getElementById('r-region').value;

      // 1. Check if passwords match
      if (password !== confirmPassword) {
        msg.textContent = 'Passwords do not match. Please try again.';
        return;
      }

      if (!region) {
        msg.textContent = 'Please select your region.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      msg.textContent = ''; 

      // 2. Sign up
      const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });

      if (authError) {
        msg.textContent = authError.message;
        btn.disabled = false;
        btn.textContent = 'Sign up';
        return;
      }

      // 3. Save profile
      if (authData.user) {
        const profileData = {
          id: authData.user.id,
          first_name: document.getElementById('r-fname').value,
          last_name: document.getElementById('r-lname').value,
          email: email,
          phone: document.getElementById('r-phone').value,
          region: region,
          city: document.getElementById('r-city').value,
          landmark: document.getElementById('r-address').value,
        };

        await supabaseClient.from('profiles').upsert(profileData);

        document.getElementById('register-form').innerHTML = `
          <div style="text-align:center; padding:20px;">
            <h3 style="color:#fff;">✓ Check Your Email</h3>
            <p style="font-size:14px; color:rgba(255,255,255,0.8);">We sent a verification link to <strong>${email}</strong>.</p>
            <p style="font-size:12px; color:rgba(255,255,255,0.6);">Please click the link to verify your account.</p>
            <a href="login.html" class="auth-btn" style="display:block; text-decoration:none; margin-top:20px;">Go to Login</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
