<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login - CT Collection</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    /* Style for the eye icon container */
    .password-wrapper {
      position: relative;
      width: 100%;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px; /* Make room for the eye icon */
      box-sizing: border-box;
    }
    .toggle-password-admin {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #737373;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-password-admin:hover {
      color: #0a0a0a;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form">
      <h1>Admin Login</h1>
      <p class="muted">Sign in to manage your store.</p>

      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />

      <label for="password">Password</label>
      
      <!-- Wrap the password input so we can absolutely position the eye icon -->
      <div class="password-wrapper">
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="button" class="toggle-password-admin" id="toggle-password" aria-label="Show password">
          <!-- Eye Open Icon -->
          <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <!-- Eye Closed Icon -->
          <svg id="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>

      <button class="btn btn-dark" type="submit" id="login-btn">Sign In</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.replace('index.html');

      // --- PASSWORD PREVIEW LOGIC ---
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eye-open');
      const eyeClosed = document.getElementById('eye-closed');

      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
        } else {
          passInput.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
        }
      });

      // --- LOGIN LOGIC ---
      const form = document.getElementById('login-form');
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        window.location.replace('index.html');
      });
    })();
  </script>
</body>
</html>
