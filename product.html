<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container" id="product-root">
    <p style="padding:40px 0; text-align:center;" class="muted">Loading product…</p>
  </main>

  <!-- Related Products Section -->
  <section class="section container" id="related-section" style="display:none; border-top: 1px solid #e5e5e5;">
    <div class="section-head">
      <div><p>Complete the look</p><h2>You May Also Like</h2></div>
    </div>
    <div class="product-grid" id="related-grid"></div>
  </section>

  <!-- Reviews Section -->
  <section class="section container" style="border-top: 1px solid #e5e5e5; padding-left: 20px; padding-right: 20px; max-width: 900px; margin: 0 auto;">
    <div class="section-head" style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div><p>What customers say</p><h2>Customer Reviews</h2></div>
      <!-- NEW: View All Button -->
      <button id="view-all-reviews-btn" style="display: none; background: none; border: none; color: #16a34a; font-weight: 600; cursor: pointer; text-decoration: underline;">View All</button>
    </div>
    
    <!-- Main List (Shows max 3) -->
    <div id="reviews-list" style="margin-bottom: 30px; display: flex; flex-direction: column; gap: 16px;"></div>
    
    <div class="form-card" style="margin: 0;" id="review-form-card">
      <h3 style="margin-top:0;">Leave a Review</h3>
      
      <div id="login-prompt" style="display: none; background: #fef3c7; color: #92400e; padding: 15px; border-radius: 8px; font-size: 14px; text-align: center;">
        Please <a href="login.html" style="text-decoration: underline; font-weight: bold;">log in</a> to leave a review.
      </div>

      <form id="review-form" style="display: none;">
        <div class="form-field"><label>Rating</label>
          <select id="r-rating" required>
            <option value="5">5 Stars - Excellent</option>
            <option value="4">4 Stars - Good</option>
            <option value="3">3 Stars - Average</option>
            <option value="2">2 Stars - Poor</option>
            <option value="1">1 Star - Terrible</option>
          </select>
        </div>
        <div class="form-field"><label>Comment</label><textarea id="r-comment" rows="3" required></textarea></div>
        <button type="submit" class="btn btn-dark" style="width:100%;" id="submit-review-btn">Submit Review</button>
        <p id="r-msg" style="text-align:center; margin-top:10px; font-size:13px; display:none;"></p>
      </form>
      
      <div id="review-success" style="display: none; text-align: center; padding: 30px 20px; border: 1px solid #e5e5e5; border-radius: 12px; background: #fafafa;">
        <div style="width: 50px; height: 50px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h4 style="color: #166534; margin: 0 0 8px; font-size: 18px;">Thank you for your review</h4>
        <p class="muted" style="margin: 0;">Your feedback has been submitted and is awaiting approval.</p>
      </div>
    </div>
  </section>

  <!-- NEW: All Reviews Modal -->
  <div id="all-reviews-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #fff; border-radius: 12px; width: 100%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
      
      <div style="padding: 20px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
        <h3 style="margin: 0; font-size: 20px;">All Customer Reviews</h3>
        <button onclick="closeAllReviewsModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666; line-height: 1;">&times;</button>
      </div>
      
      <div id="all-reviews-list" style="padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px;">
        <!-- Reviews will be injected here -->
      </div>
      
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/product.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
      });
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const form = document.getElementById('review-form');
      const prompt = document.getElementById('login-prompt');
      
      if (session) {
        form.style.display = 'block';
        prompt.style.display = 'none';
      } else {
        form.style.display = 'none';
        prompt.style.display = 'block';
      }
    })();

    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-review-btn');
      const msg = document.getElementById('r-msg');
      
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return alert('You must be logged in.');

      const { data: profile } = await supabaseClient.from('profiles').select('first_name, last_name').eq('id', user.id).single();
      
      const customerName = profile ? `${profile.first_name || ''} ${profile.last_name || ''}`.trim() : 'Verified Customer';

      const { error } = await supabaseClient.from('reviews').insert({
        customer_name: customerName,
        rating: Number(document.getElementById('r-rating').value),
        comment: document.getElementById('r-comment').value,
        product_id: window.currentProductId,
        user_id: user.id,
        approved: false
      });

      if (error) {
        msg.textContent = error.message;
        msg.style.color = '#dc2626';
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Review';
      } else {
        document.getElementById('review-form').style.display = 'none';
        document.getElementById('review-success').style.display = 'block';
      }
    });
  </script>
</body>
</html>
