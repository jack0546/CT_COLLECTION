<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find Us — Great Addesam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css" />
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    #map { height: 500px; width: 100%; border-radius: 12px; border: 1px solid #e5e5e5; z-index: 1; }
    .map-container { padding: 32px 16px 80px; max-width: 900px; margin: 0 auto; }
    .routing-error { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; display: none; line-height: 1.5; }
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container map-container">
    <h1 style="margin-bottom: 8px;">Find Our Store</h1>
    <p class="muted" style="margin-bottom: 24px;">Get directions from your current location to our shop.</p>

    <div id="routing-error" class="routing-error"></div>

    <div id="map"></div>
    
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
      <button id="get-directions-btn" class="btn btn-dark">📍 Allow Location & Show Route</button>
      <a id="open-google-maps" href="#" target="_blank" class="btn btn-green" style="display: none; text-align: center; text-decoration: none; padding: 12px;">🚗 Open in Google Maps for Voice Navigation</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    const SHOP_LAT = 6.073809394680172;  
    const SHOP_LNG = -0.2702869096208078; 
    const SHOP_NAME = "Great Addesam Store";

    // 1. Initialize the Map
    const map = L.map('map').setView([SHOP_LAT, SHOP_LNG], 14);

    // 2. Add OpenStreetMap Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Add a Marker for your Shop
    L.marker([SHOP_LAT, SHOP_LNG]).addTo(map)
      .bindPopup(`<b>${SHOP_NAME}</b><br>Your order destination.`).openPopup();

    let routingControl = null;
    const btn = document.getElementById('get-directions-btn');
    const errDiv = document.getElementById('routing-error');

    // 4. Check permission state on page load
    if (navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then((result) => {
        if (result.state === 'granted') {
          btn.textContent = '📍 Show Route on Map';
        } else if (result.state === 'denied') {
          btn.textContent = '❌ Location Blocked (Tap for Help)';
        }
      });
    }

    // 5. Main Geolocation Function
    btn.addEventListener('click', () => {
      // Check if permission was previously denied
      if (navigator.permissions) {
        navigator.permissions.query({ name: 'geolocation' }).then((result) => {
          if (result.state === 'denied') {
            errDiv.innerHTML = "❌ <strong>Permission Denied:</strong><br><br>You have blocked location access for this app.<br><br><strong>To fix this:</strong><br>1. Go to your phone's Settings.<br>2. Find 'Apps' or 'Applications' and locate 'Great Addesam'.<br>3. Go to 'Permissions' and allow <strong>Location</strong>.<br>4. Refresh this page.";
            errDiv.style.display = 'block';
            return;
          }
          requestLocation();
        });
      } else {
        requestLocation();
      }
    });

    function requestLocation() {
      btn.textContent = 'Getting location...';
      btn.disabled = true;
      errDiv.style.display = 'none';

      if (!navigator.geolocation) {
        showError("❌ Your device/browser does not support location services.");
        return;
      }

      // Request GPS
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          btn.textContent = '📍 Show Route on Map';
          btn.disabled = false;

          if (routingControl) map.removeControl(routingControl);

          // Draw the route
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLng), 
              L.latLng(SHOP_LAT, SHOP_LNG) 
            ],
            routeWhileDragging: false,
            addWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
            lineOptions: { styles: [{ color: '#16a34a', weight: 6 }] }
          }).addTo(map);

          // Google Maps Link
          const googleMapsBtn = document.getElementById('open-google-maps');
          googleMapsBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${SHOP_LAT},${SHOP_LNG}&travelmode=driving`;
          googleMapsBtn.style.display = 'block';

          // Low accuracy warning
          if (accuracy > 1000) {
            errDiv.innerHTML = "⚠️ <strong>Low Accuracy:</strong> Your device is using Wi-Fi to estimate location. Click the green button below for exact GPS navigation.";
            errDiv.style.display = 'block';
          }
        },
        (error) => {
          btn.textContent = '📍 Allow Location & Show Route';
          btn.disabled = false;
          
          if (error.code === 1) { 
            errDiv.innerHTML = "❌ Location access denied. Please enable it in your device settings.";
          } else if (error.code === 2) { 
            errDiv.innerHTML = "❌ Location unavailable. Ensure your phone's GPS is turned on.";
          } else { 
            errDiv.innerHTML = "❌ Getting location timed out. Please try again.";
          }
          errDiv.style.display = 'block';
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    function showError(msg) {
      errDiv.innerHTML = msg;
      errDiv.style.display = 'block';
      btn.textContent = '📍 Allow Location & Show Route';
      btn.disabled = false;
    }
  </script>
</body>
</html>
