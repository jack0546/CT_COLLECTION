<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track Order — Great Addesam</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .tracker-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 30px; max-width: 600px; margin: 0 auto; }
    .timeline { display: flex; justify-content: space-between; margin-top: 30px; position: relative; }
    .timeline::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: #e5e5e5; z-index: 1; }
    .timeline-step { position: relative; z-index: 2; text-align: center; flex: 1; }
    .timeline-circle { width: 32px; height: 32px; border-radius: 50%; background: #e5e5e5; color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-weight: bold; }
    .timeline-step.active .timeline-circle { background: #16a34a; }
    .timeline-step.completed .timeline-circle { background: #0a0a0a; }
    .timeline-label { font-size: 12px; color: #737373; font-weight: 500; }
    .timeline-step.active .timeline-label { color: #16a34a; font-weight: bold; }
    .hidden { display: none !important; }

    .printer-container { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px dashed #e5e5e5; }
    .printer-body { width: 260px; margin: 0 auto; background: #111; border-radius: 12px 12px 0 0; padding: 15px; position: relative; box-shadow: inset 0 5px 10px rgba(255,255,255,0.1); border: 2px solid #333; }
    .printer-slot { width: 200px; height: 10px; background: #000; margin: 0 auto; border-radius: 5px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); border-bottom: 1px solid #444; }
    .receipt-paper-wrapper { width: 100%; max-width: 320px; margin: 0 auto; overflow: hidden; height: 0; transition: height 1.5s ease-in-out; }
    .receipt-paper-wrapper.printing { height: 900px; }
    
    .receipt-paper {
      width: 100%; background: #fdfdfd; padding: 20px; text-align: left;
      font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #000;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid #eee;
      border-radius: 0 0 4px 4px; position: relative; overflow: hidden; z-index: 1;
      box-sizing: border-box;
    }
    .receipt-header { text-align: center; margin-bottom: 15px; }
    .receipt-header h2 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
    .receipt-header p { margin: 4px 0; font-size: 11px; color: #555; }
    .receipt-divider { border-top: 1px dashed #000; margin: 10px 0; }
    .receipt-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .receipt-table th { text-align: left; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .receipt-table td { padding: 4px 0; vertical-align: top; }
    .receipt-total-row { font-weight: bold; font-size: 14px; margin-top: 10px; text-align: right; }
    .receipt-footer { text-align: center; font-size: 10px; margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding: 40px 16px 80px;">
    <h1 style="text-align: center; margin-bottom: 30px;">Track Your Order</h1>

    <div class="tracker-card" id="tracker-form-card">
      <p class="muted" style="margin-bottom: 20px; text-align: center;">Enter your Order Reference and Phone Number to see your order status.</p>
      <form id="tracker-form">
        <div class="form-field"><label>Order Reference</label><input id="t-ref" required /></div>
        <div class="form-field"><label>Phone Number</label><input id="t-phone" required /></div>
        <button type="submit" class="btn btn-dark" style="width: 100%; margin-top: 10px;" id="t-btn">Find My Order</button>
      </form>
      <div id="t-error" class="hidden" style="color: #dc2626; text-align: center; margin-top: 15px; font-size: 14px;"></div>
    </div>

    <div class="tracker-card hidden" id="tracker-result-card">
      <h2 style="margin: 0 0 4px;">Order: <span id="r-ref" style="font-weight: normal; color: #525252;"></span></h2>
      <p class="muted" style="margin-bottom: 20px;">
        Total: <span id="r-total" style="font-weight: bold; color: #0a0a0a;"></span> <br>
        Payment: <span id="r-payment" style="font-weight: bold;"></span>
      </p>

      <div class="timeline" id="r-timeline">
        <div class="timeline-step" data-step="pending"><div class="timeline-circle">1</div><div class="timeline-label">Pending</div></div>
        <div class="timeline-step" data-step="confirmed"><div class="timeline-circle">2</div><div class="timeline-label">Confirmed</div></div>
        <div class="timeline-step" data-step="shipped"><div class="timeline-circle">3</div><div class="timeline-label">Shipped</div></div>
        <div class="timeline-step" data-step="delivered"><div class="timeline-circle">✓</div><div class="timeline-label">Delivered</div></div>
      </div>

      <div style="margin-top: 30px; border-top: 1px solid #e5e5e5; padding-top: 15px;">
        <h4 style="margin: 0 0 10px;">Items</h4>
        <div id="r-items"></div>
      </div>

      <div id="receipt-section" class="hidden">
        <div class="printer-container">
          <button id="generate-receipt-btn" class="btn btn-dark" style="width: 100%; margin-bottom: 20px;">🖨️ Generate Receipt</button>
          <div class="printer-body"><div class="printer-slot"></div></div>
          <div class="receipt-paper-wrapper" id="receipt-wrapper">
            <div class="receipt-paper" id="printable-receipt"></div>
          </div>
          <button id="download-pdf-btn" class="btn btn-light hidden" style="width: 100%; margin-top: 20px; border: 1px solid #0a0a0a;">⬇️ Save as PDF</button>
        </div>
      </div>

      <button class="btn btn-light" style="width: 100%; margin-top: 20px;" onclick="location.reload()">Track another order</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    const STATUS_MAP = { pending: 0, confirmed: 1, processing: 1, shipped: 2, delivered: 3, cancelled: -1 };
    let currentOrderData = null;
    let currentSettings = null;

    document.getElementById('tracker-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('t-btn');
      const errEl = document.getElementById('t-error');
      const ref = document.getElementById('t-ref').value.trim();
      const phone = document.getElementById('t-phone').value.trim();

      btn.disabled = true;
      btn.textContent = 'Searching...';
      errEl.classList.add('hidden');

      currentSettings = await getStoreSettings();

      // NOTE: Ensure your Supabase RPC function returns all columns (including email, address, notes)
      const { data, error } = await supabaseClient.rpc('get_order_by_reference', { p_reference: ref, p_phone: phone });

      btn.disabled = false;
      btn.textContent = 'Find My Order';

      const order = data && data.length > 0 ? data[0] : null;

      if (error || !order) {
        errEl.textContent = 'Order not found. Please check your reference and phone number.';
        errEl.classList.remove('hidden');
        return;
      }

      currentOrderData = order;

      document.getElementById('tracker-form-card').classList.add('hidden');
      document.getElementById('tracker-result-card').classList.remove('hidden');
      
      document.getElementById('r-ref').textContent = order.order_reference;
      document.getElementById('r-total').textContent = `₵ ${Number(order.total_amount).toFixed(2)}`;

      const payEl = document.getElementById('r-payment');
      if (order.payment_status === 'paid') {
        payEl.textContent = 'Paid ✓';
        payEl.style.color = '#166534';
        document.getElementById('receipt-section').classList.remove('hidden');
      } else {
        payEl.textContent = 'Unpaid';
        payEl.style.color = '#dc2626';
        document.getElementById('receipt-section').classList.add('hidden');
      }

      const items = order.order_items || [];
      document.getElementById('r-items').innerHTML = items.map(i => `
        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
          <span>${i.productName} (${i.colourName}/${i.size}) ×${i.quantity}</span>
          <span>₵ ${Number(i.unitPrice * i.quantity).toFixed(2)}</span>
        </div>
      `).join('');

      const currentStatus = order.status;
      const currentStep = STATUS_MAP[currentStatus];

      if (currentStatus === 'cancelled') {
        document.getElementById('r-timeline').innerHTML = `<div style="color:#dc2626; font-weight:bold; text-align:center; width:100%;">This order has been cancelled. Please contact us for details.</div>`;
      } else {
        document.querySelectorAll('.timeline-step').forEach(el => {
          const stepIndex = STATUS_MAP[el.dataset.step];
          el.classList.remove('active', 'completed');
          if (stepIndex < currentStep) el.classList.add('completed');
          if (stepIndex === currentStep) el.classList.add('active');
        });
      }
    });

    function buildReceiptHTML() {
      const order = currentOrderData;
      const symbol = currentSettings?.currency_symbol || '₵';
      const date = new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      const itemsHTML = order.order_items.map(item => `
        <tr>
          <td>${item.productName}<br><span style="color:#555; font-size:10px;">${item.colourName} / ${item.size}</span></td>
          <td style="text-align:center;">${item.quantity}</td>
          <td style="text-align:right;">${symbol} ${Number(item.unitPrice).toFixed(2)}</td>
          <td style="text-align:right;">${symbol} ${Number(item.unitPrice * item.quantity).toFixed(2)}</td>
        </tr>
      `).join('');

      return `
        <div class="receipt-header">
          <h2>${currentSettings?.store_name || 'GREAT ADDESAM'}</h2>
          <p>${currentSettings?.contact_phone || ''}</p>
          <p>${currentSettings?.contact_email || ''}</p>
        </div>
        <div class="receipt-divider"></div>
        
        <div style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 12px;">STATUS: PAID</div>
        
        <div style="font-size: 11px; margin-bottom: 10px;">
          <div><strong>Order:</strong> ${order.order_reference}</div>
          <div><strong>Date:</strong> ${date}</div>
          <div><strong>Customer:</strong> ${order.customer_name}</div>
          <div><strong>Phone:</strong> ${order.customer_phone}</div>
          <div><strong>Email:</strong> ${order.customer_email || 'N/A'}</div>
          <div><strong>Location:</strong> ${order.delivery_location}</div>
          <div><strong>Address:</strong> ${order.delivery_address}</div>
          ${order.notes ? `<div><strong>Notes:</strong> ${order.notes}</div>` : ''}
        </div>
        
        <div class="receipt-divider"></div>
        
        <table class="receipt-table">
          <thead>
            <tr>
              <th style="width: 45%;">Item</th>
              <th style="width: 15%; text-align:center;">Qty</th>
              <th style="width: 20%; text-align:right;">Price</th>
              <th style="width: 20%; text-align:right;">Total</th>
            </tr>
          </thead>
          <tbody>${itemsHTML}</tbody>
        </table>
        
        <div class="receipt-divider"></div>
        <div class="receipt-total-row">TOTAL: ${symbol} ${Number(order.total_amount).toFixed(2)}</div>
        <div class="receipt-divider"></div>
        
        <div class="receipt-footer">
          <p>Thank you for shopping with us!</p>
          <p>This is a computer-generated receipt.</p>
        </div>
      `;
    }

    document.getElementById('generate-receipt-btn').addEventListener('click', () => {
      if (!currentOrderData) return;
      document.getElementById('printable-receipt').innerHTML = buildReceiptHTML();
      document.getElementById('receipt-wrapper').classList.add('printing');
      document.getElementById('generate-receipt-btn').style.display = 'none';
      setTimeout(() => {
        document.getElementById('download-pdf-btn').classList.remove('hidden');
      }, 1500);
    });

    // Save as PDF (Draws text directly to avoid character encoding errors)
    document.getElementById('download-pdf-btn').addEventListener('click', () => {
      const order = currentOrderData;
      const currencyText = 'GHS';
      const dateStr = new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      
      const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: [105, 250] });
      
      let y = 15; 
      const left = 8;
      const right = 97;
      const center = 52.5;

      // HEADER
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.text(currentSettings?.store_name || 'GREAT ADDESAM', center, y, { align: 'center' });
      y += 6;
      
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      if (currentSettings?.contact_phone) { doc.text(currentSettings.contact_phone, center, y, { align: 'center' }); y += 4; }
      if (currentSettings?.contact_email) { doc.text(currentSettings.contact_email, center, y, { align: 'center' }); y += 4; }
      
      y += 2;
      doc.line(10, y, 95, y);
      y += 6;

      // STATUS
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(22, 163, 74);
      doc.text('STATUS: PAID', center, y, { align: 'center' });
      doc.setTextColor(0, 0, 0);
      y += 6;

      // ORDER DETAILS
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text(`Order: ${order.order_reference}`, left, y); y += 5;
      doc.text(`Date:  ${dateStr}`, left, y); y += 5;
      doc.text(`Customer: ${order.customer_name}`, left, y); y += 5;
      doc.text(`Phone: ${order.customer_phone}`, left, y); y += 5;
      doc.text(`Email: ${order.customer_email || 'N/A'}`, left, y); y += 5;
      doc.text(`Location: ${order.delivery_location}`, left, y); y += 5;
      
      const addressLines = doc.splitTextToSize(`Address: ${order.delivery_address}`, 85);
      doc.text(addressLines, left, y);
      y += (addressLines.length * 5);

      if (order.notes) {
        const notesLines = doc.splitTextToSize(`Notes: ${order.notes}`, 85);
        doc.text(notesLines, left, y);
        y += (notesLines.length * 5);
      }
      
      y += 2;
      doc.line(10, y, 95, y); 
      y += 6;

      // COLUMN HEADERS
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.text('Item', left, y);
      doc.text('Qty', 65, y);
      doc.text('Total', right, y, { align: 'right' });
      y += 4;
      doc.line(10, y, 95, y); 
      y += 6;

      // ITEMS
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      order.order_items.forEach(item => {
        const nameLines = doc.splitTextToSize(item.productName, 50);
        doc.text(nameLines, left, y);
        const itemHeight = nameLines.length * 4;
        
        doc.setFontSize(7);
        doc.text(`${item.colourName} / ${item.size}`, left + 2, y + itemHeight);
        doc.setFontSize(9);
        
        const lineTotal = Number(item.unitPrice * item.quantity).toFixed(2);
        doc.text(`${item.quantity}`, 65, y);
        doc.text(`${currencyText} ${lineTotal}`, right, y, { align: 'right' });
        
        y += itemHeight + 6;
      });

      y += 2;
      doc.line(10, y, 95, y); 
      y += 8;

      // TOTAL
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(`TOTAL: ${currencyText} ${Number(order.total_amount).toFixed(2)}`, right, y, { align: 'right' });
      y += 10;

      // FOOTER
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.text('Thank you for shopping with us!', center, y, { align: 'center' });
      y += 5;
      doc.text('This is a computer-generated receipt.', center, y, { align: 'center' });

      doc.save(`Receipt-${order.order_reference}.pdf`);
    });
  </script>
</body>
</html>
